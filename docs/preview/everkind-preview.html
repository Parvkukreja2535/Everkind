<title>Everkind Design Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:wght@400;500;600&display=swap">
<style>
/* Layout: spacious public pages + Evernote-inspired app shell (dark sidebar, white canvas, list/detail). Palette: Evernote-style white/grey/near-black with green accent (owner request). Single light theme (no dark mode at launch). */
:root{
  --forest:#00842A; --forest-2:#00732A; --ink:#1A1A1A; --ivory:#FFFFFF; --ivory-2:#F8F8F8; --sage:#CFEAD6; --sage-tint:#EEF7F0;
  --champagne:#00A82D; --champagne-deep:#00842A; --charcoal:#333333; --muted:#6B6B6B; --sage-deep:#00842A;
  --line:#E6E6E6; --white:#FFFFFF;
  --ok:#2F6B4F; --warn:#8A5A12; --err:#A23B2C; --info:#2E5A73;
  --display:"Playfair Display", Georgia, "Times New Roman", serif;
  --sans:"DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --r-card:12px; --r-ctl:10px;
  --gutter-l:max(16px, env(safe-area-inset-left, 0px)); --gutter-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--ivory)}
body{color:var(--charcoal);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--charcoal)}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--champagne-deep);outline-offset:2px;border-radius:6px}
.wrap{max-width:1200px;margin:0 auto;padding-left:var(--gutter-l);padding-right:var(--gutter-r)}
.tnum{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--sage-deep)}
.sample{display:inline-block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--champagne-deep);border:1px solid var(--champagne);border-radius:999px;padding:1px 7px;vertical-align:middle;margin-left:6px;background:var(--white)}

/* Preview banner + view switcher */
.pbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--charcoal);color:var(--ivory)}
.pbar .wrap{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-block:8px}
.pbar strong{color:var(--champagne);font-weight:600}
.pbar .note{font-size:13px}
.views{display:flex;flex-wrap:wrap;gap:6px}
.views a{font-size:12.5px;text-decoration:none;padding:4px 10px;border-radius:999px;border:1px solid #4A504D;color:var(--ivory)}
.views a[aria-current="page"]{background:var(--forest);border-color:var(--forest);color:#fff;font-weight:600}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:var(--r-ctl);font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;border:1px solid transparent;transition:background .2s,color .2s,border-color .2s,transform .2s}
.btn-primary{background:var(--forest);color:#fff}
.btn-primary:hover{background:var(--forest-2)}
.btn-secondary{background:transparent;color:var(--forest);border-color:var(--forest)}
.btn-secondary:hover{background:var(--sage-tint)}
.btn-light{background:var(--champagne);color:var(--ink)}
.btn-light:hover{background:#19B841}
.btn-ghost-light{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.btn-ghost-light:hover{border-color:#fff}
.btn-sm{height:36px;padding:0 14px;font-size:14px}
.btn-lg{height:52px;padding:0 26px;font-size:16px}
.link{color:var(--forest);font-weight:600;text-decoration:none;border-bottom:1px solid transparent}
.link:hover{border-bottom-color:var(--forest)}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.02em;padding:3px 10px;border-radius:999px;white-space:nowrap}
.chip svg{width:13px;height:13px}
.l-now{background:var(--forest);color:#fff}
.l-soon{background:var(--sage-tint);color:var(--forest);border:1px solid var(--sage)}
.l-planned{background:var(--white);color:var(--muted);border:1px solid var(--line)}
.l-approval{background:#FBF5EA;color:var(--warn);border:1px solid #E5CFA5}
.s-info{background:#E3ECF1;color:var(--info)} .s-ok{background:#E2EEE7;color:var(--ok)} .s-warn{background:#F4EAD9;color:var(--warn)}
.s-live{background:var(--forest);color:#fff} .s-neutral{background:var(--ivory-2);color:var(--muted)}

/* Public nav */
.nav{background:var(--ivory);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:16px}
.logo{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-size:26px;font-weight:500;color:var(--forest);text-decoration:none;letter-spacing:.01em}
.logo .mark{width:22px;height:22px}
.nav-links{display:flex;gap:28px;align-items:center;font-size:15px}
.nav-links a{text-decoration:none;color:var(--charcoal)}
.nav-links a:hover{color:var(--forest)}
.nav-cta{display:flex;gap:10px;align-items:center}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:var(--r-ctl);height:40px;width:44px;cursor:pointer}

/* Home */
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;padding-block:72px 88px}
.hero h1{font-family:var(--display);font-weight:500;font-size:clamp(40px,5.6vw,66px);line-height:1.06;color:var(--charcoal);letter-spacing:-.01em}
.hero .lede{font-size:19px;color:var(--muted);max-width:520px;margin-top:20px}
.finder{margin-top:32px;display:flex;gap:8px;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:8px;max-width:540px;box-shadow:0 10px 30px -18px rgba(24,61,53,.35)}
.finder input{flex:1;min-width:0;border:0;outline:0;padding:0 12px;font-size:16px;background:transparent}
.hero-meta{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:20px;font-size:14px;color:var(--muted)}
.hero-meta span{display:inline-flex;align-items:center;gap:6px}
.hero-meta svg{width:16px;height:16px;color:var(--sage-deep)}
.hero-art{position:relative;aspect-ratio:4/4.4;max-width:100%;border-radius:18px;overflow:hidden;background:var(--sage)}
.hero-art img.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.float-card{position:absolute;background:var(--white);border-radius:12px;padding:14px 16px;box-shadow:0 16px 40px -20px rgba(41,45,43,.45);font-size:13.5px;min-width:0}
.float-card .t{font-weight:600}
.fc-1{left:6%;bottom:12%;max-width:72%}
.fc-2{right:5%;top:7%;max-width:56%}
.photo-note{position:absolute;right:10px;bottom:10px;font-size:11px;color:var(--forest);background:rgba(245,242,234,.85);padding:2px 8px;border-radius:999px}

.ic-band{background:var(--ink);color:#fff}
.ic-band .wrap{display:grid;grid-template-columns:1.1fr .9fr 1fr;gap:40px;align-items:center;padding-block:64px}
.ic-photo{border-radius:14px;overflow:hidden;aspect-ratio:4/3;max-width:100%}
.ic-photo img{width:100%;height:100%;object-fit:cover;display:block}
.ic-band .eyebrow{color:var(--champagne)}
.ic-band h2{font-family:var(--display);font-weight:500;font-size:clamp(30px,3.6vw,44px);line-height:1.12;margin-top:10px}
.ic-band p.sub{color:#CCCCCC;margin-top:14px;max-width:560px}
.ic-points{display:grid;gap:12px}
.ic-point{display:flex;gap:12px;align-items:flex-start;border-top:1px solid rgba(0,168,45,.45);padding-top:12px}
.ic-point svg{width:20px;height:20px;color:var(--champagne);flex:none;margin-top:3px}
.ic-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}

.section{padding-block:96px}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;margin-bottom:36px}
.section-head h2{font-family:var(--display);font-weight:500;font-size:clamp(30px,3.4vw,42px);color:var(--charcoal);line-height:1.15;margin-top:8px}
.section-head p{color:var(--muted);max-width:520px;margin-top:10px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:24px}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:transform .2s ease,box-shadow .2s ease}
.card:hover{transform:translateY(-3px);box-shadow:0 18px 36px -24px rgba(24,61,53,.5)}
.card:hover .tile svg{transform:scale(1.06)}
.tile{position:relative;aspect-ratio:16/10;display:grid;place-items:center;overflow:hidden}
.tile svg{width:30%;height:auto;max-height:58%;transition:transform .3s ease}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
.card:hover .tile img{transform:scale(1.04)}
.tile.has-img::after{display:none}
.tile .chip{z-index:1}
.tile .chip svg{width:13px;height:13px;max-height:none;transform:none}
.credit{font-size:12px;color:var(--muted)}
.tile::after{content:"";position:absolute;left:18px;right:18px;bottom:14px;height:1px;background:var(--champagne);opacity:.8}
.t0{background:var(--sage-tint);color:var(--forest)} .t1{background:var(--sage);color:var(--forest)} .t2{background:var(--ivory-2);color:var(--forest)} .t3{background:var(--ink);color:var(--champagne)}
.card-body{padding:18px 18px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.card-body .cat{font-size:12px;color:var(--muted);font-weight:500}
.card-body h3{font-size:17px;font-weight:600;line-height:1.35}
.card-body .desc{font-size:14px;color:var(--muted);line-height:1.5}
.card-foot{margin-top:auto;padding-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
.price{font-weight:600;color:var(--charcoal)}
.price.dim{font-weight:500;color:var(--muted)}
.card-foot .arrow{color:var(--forest);font-weight:600}
.tile .chip{position:absolute;top:12px;left:12px}

.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.cat-tile{display:flex;gap:14px;align-items:center;padding:18px;background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);text-decoration:none;transition:border-color .2s,transform .2s}
.cat-tile:hover{border-color:var(--forest);transform:translateY(-2px)}
.cat-tile .ico{width:46px;height:46px;border-radius:10px;display:grid;place-items:center;flex:none}
.cat-tile .ico svg{width:24px;height:24px}
.cat-tile .nm{font-weight:600}
.cat-tile .ct{font-size:13px;color:var(--muted)}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
.step{border-top:1px solid var(--champagne);padding-top:18px}
.step .n{font-family:var(--display);font-size:30px;color:var(--champagne-deep)}
.step h3{font-size:18px;margin-top:6px}
.step p{color:var(--muted);margin-top:8px;font-size:15px}
.note-box{margin-top:32px;background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);padding:20px 22px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;font-size:14.5px}
.note-box b{display:block;color:var(--forest);margin-bottom:4px}

.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
.trust div svg{width:26px;height:26px;color:var(--sage-deep)}
.trust h3{font-size:17px;margin-top:12px}
.trust p{font-size:14.5px;color:var(--muted);margin-top:6px}

.hosts{background:var(--ivory-2)}
.hosts .wrap{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center;padding-block:88px}
.hosts h2{font-family:var(--display);font-weight:500;font-size:clamp(30px,3.4vw,42px);color:var(--charcoal);line-height:1.15;margin-top:8px}
.price-list{background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);padding:8px 22px}
.price-row{display:flex;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.price-row:last-child{border-bottom:0}

.faq details{border-bottom:1px solid var(--line);padding:18px 0}
.faq summary{cursor:pointer;font-weight:600;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::after{content:"+";color:var(--forest);font-size:22px;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq p{color:var(--muted);margin-top:10px;max-width:720px}

.footer{background:var(--ink);color:#CCCCCC;font-size:14px}
.footer .wrap{display:grid;grid-template-columns:1.4fr repeat(3,1fr);gap:32px;padding-block:56px}
.footer .logo{color:#fff}
.footer h4{color:#fff;font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 12px}
.footer ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.footer a{text-decoration:none}
.footer a:hover{color:#fff}
.footer .legal{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.14);padding-top:20px;font-size:13px}

/* Explore */
.explore-head{padding-block:64px 32px}
.explore-head h1{font-family:var(--display);font-weight:500;font-size:clamp(38px,5vw,58px);color:var(--charcoal);line-height:1.08}
.explore-head .lede{color:var(--muted);font-size:18px;margin-top:12px;max-width:640px}
.search-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.field{display:flex;align-items:center;gap:10px;background:var(--white);border:1px solid var(--line);border-radius:var(--r-ctl);height:48px;padding:0 14px;min-width:0}
.field:focus-within{border-color:var(--forest);box-shadow:0 0 0 3px var(--sage-tint)}
.field svg{width:18px;height:18px;color:var(--muted);flex:none}
.field input{border:0;outline:0;background:transparent;font-size:15.5px;width:100%;min-width:0}
.search-row .grow{flex:1 1 320px}
.search-row .pc{flex:0 1 200px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.fchip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--white);font-size:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.fchip[aria-pressed="true"]{background:var(--forest);color:var(--ivory);border-color:var(--forest)}
.fchip .c{font-size:12px;opacity:.75}
.explore-body{display:grid;grid-template-columns:220px 1fr;gap:40px;padding-bottom:96px}
.cat-nav{position:sticky;top:110px;align-self:start;display:grid;gap:2px}
.cat-nav a{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-radius:8px;text-decoration:none;font-size:14.5px;color:var(--charcoal)}
.cat-nav a:hover{background:var(--sage-tint)}
.cat-nav a span{color:var(--muted);font-size:13px}
.cat-section{margin-bottom:56px;scroll-margin-top:120px}
.cat-section h2{font-family:var(--display);font-weight:500;font-size:30px;color:var(--charcoal)}
.cat-section .cdesc{color:var(--muted);margin:6px 0 20px;font-size:15px}
.empty{padding:48px 24px;text-align:center;background:var(--white);border:1px dashed var(--line);border-radius:var(--r-card);color:var(--muted)}
.label-key{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:28px}
.label-key div{font-size:13.5px;color:var(--muted)}
.label-key .chip{margin-bottom:6px}

/* Service detail */
.crumbs{font-size:14px;color:var(--muted);padding-block:24px 0}
.crumbs a{text-decoration:none;color:var(--muted)} .crumbs a:hover{color:var(--forest)}
.svc{display:grid;grid-template-columns:1.25fr .9fr;gap:56px;padding-block:24px 96px;align-items:start}
.svc h1{font-family:var(--display);font-weight:500;font-size:clamp(34px,4.4vw,52px);color:var(--charcoal);line-height:1.1;margin-top:14px}
.svc .lede{font-size:18px;color:var(--muted);margin-top:14px;max-width:620px}
.svc-tile{margin-top:28px;border-radius:16px;aspect-ratio:16/8}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
.fact{background:var(--white);border:1px solid var(--line);border-radius:var(--r-card);padding:14px 16px;font-size:14px}
.fact .k{color:var(--muted);font-size:12.5px}
.fact .v{font-weight:600;margin-top:2px}
.block{margin-top:36px}
.block h2{font-size:20px;font-weight:600;color:var(--forest);margin-bottom:12px}
.ticks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ticks li{display:flex;gap:10px;align-items:flex-start;font-size:15.5px}
.ticks svg{width:18px;height:18px;flex:none;margin-top:3px}
.ticks.yes svg{color:var(--ok)} .ticks.no svg{color:var(--err)}
.panel{position:sticky;top:110px;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 20px 40px -32px rgba(24,61,53,.45)}
.panel h3{font-size:18px}
.panel .big{font-size:28px;font-weight:600;margin-top:6px}
.panel .small{font-size:13.5px;color:var(--muted)}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:var(--r-ctl);padding:12px 14px;margin-top:10px;cursor:pointer}
.opt:has(input:checked){border-color:var(--forest);background:var(--sage-tint)}
.opt input{margin-top:4px;accent-color:var(--forest)}
.opt .on{font-weight:600}
.opt .od{font-size:13.5px;color:var(--muted)}
.lbl{display:block;font-size:13.5px;font-weight:600;margin:18px 0 8px}
.tasks{display:grid;gap:6px}
.task{display:flex;align-items:center;gap:10px;font-size:14.5px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--white)}
.task input{accent-color:var(--forest)}
.task .ord{margin-left:auto;font-size:12px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:38px;min-width:54px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--white);cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--forest);color:var(--ivory);border-color:var(--forest)}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);margin-top:18px;padding-top:14px}
.notice{border-radius:10px;padding:12px 14px;font-size:13.5px;margin-top:14px;display:flex;gap:10px;align-items:flex-start}
.notice svg{width:18px;height:18px;flex:none;margin-top:2px}
.n-info{background:#E3ECF1;color:#24485C} .n-warn{background:#F4EAD9;color:#6E480E} .n-gate{background:#FBF5EA;border:1px solid #E5CFA5;color:var(--charcoal)}
.form-row{display:grid;gap:6px;margin-top:12px}
.form-row label{font-size:13.5px;font-weight:600}
.input{height:44px;border:1px solid var(--line);border-radius:var(--r-ctl);padding:0 12px;background:var(--white);width:100%}
.input:focus{outline:0;border-color:var(--forest);box-shadow:0 0 0 3px var(--sage-tint)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;margin-top:12px;color:var(--muted)}
.check input{margin-top:3px;accent-color:var(--forest)}
.panel .btn{width:100%;margin-top:18px}

/* App shell */
.app{display:grid;grid-template-columns:248px 1fr;min-height:calc(100vh - 44px)}
.side{background:var(--ink);color:#CCCCCC;padding:20px 14px;display:flex;flex-direction:column;gap:4px}
.side .logo{color:#fff;font-size:23px;padding:4px 10px 18px}
.side .role{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--champagne);padding:0 10px 8px}
.side button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:0;color:#CCCCCC;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14.5px}
.side button svg{width:18px;height:18px;flex:none}
.side button:hover{background:rgba(255,255,255,.06);color:var(--ivory)}
.side button[aria-current="true"]{background:rgba(0,168,45,.18);color:#fff;box-shadow:inset 3px 0 0 var(--champagne)}
.side .badge{margin-left:auto;background:var(--champagne);color:var(--ink);font-size:11px;font-weight:700;border-radius:999px;padding:0 7px}
.side .spacer{flex:1}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid var(--line);background:var(--ivory)}
.topbar .field{flex:1;max-width:460px;height:40px}

/* ---------- Router ---------- */
const view = document.getElementById('view');
function route(){
  const h = (location.hash||'#home').slice(1);
  let key = 'home';
  if(h==='home'||h==='home-hosts'||h==='home-how'){ view.innerHTML = home(); key='home'; if(h!=='home'){ requestAnimationFrame(()=>document.getElementById(h)?.scrollIntoView()); } else window.scrollTo(0,0); }
  else if(h==='services'){ view.innerHTML = explore(); renderResults(); key='services'; window.scrollTo(0,0); }
  else if(h.startsWith('svc-')){ view.innerHTML = serviceDetail(h.slice(4)); key='svc-instant-clean'; window.scrollTo(0,0); }
  else if(h==='customer'){ view.innerHTML = customer(); key='customer'; window.scrollTo(0,0); }
  else if(h==='admin'){ view.innerHTML = admin(); key='admin'; window.scrollTo(0,0); }
  else { view.innerHTML = home(); }
  document.querySelectorAll('.views a').forEach(a=>a.setAttribute('aria-current', a.getAttribute('href')==='#'+key ? 'page':'false'));
  updateIC();
}
window.addEventListener('hashchange', route);

/* ---------- Interactions ---------- */
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }
function updateIC(){
  const box = document.getElementById('ic-tasks'); if(!box) return;
  let n=0; box.querySelectorAll('.task').forEach(l=>{const c=l.querySelector('input'); l.querySelector('.ord').textContent = c.checked ? 'Priority '+(++n) : '';});
}
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-toast]'); if(t){ e.preventDefault(); toast(t.dataset.toast); return; }
  const f = e.target.closest('.fchip[data-label]'); if(f){ exState.label=f.dataset.label; document.querySelectorAll('.fchip[data-label]').forEach(b=>b.setAttribute('aria-pressed', b===f)); renderResults(); return; }
  const j = e.target.closest('[data-jump]'); if(j){ e.preventDefault(); exState.label='all'; exState.q=''; const qi=document.getElementById('q'); if(qi) qi.value=''; document.querySelectorAll('.fchip[data-label]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.label==='all')); renderResults(); document.getElementById('cat-'+j.dataset.jump)?.scrollIntoView({behavior:'smooth'}); return; }
  const ct = e.target.closest('.cat-tile[data-cat]'); if(ct){ e.preventDefault(); location.hash='services'; setTimeout(()=>document.getElementById('cat-'+ct.dataset.cat)?.scrollIntoView(),60); return; }
  const hb = e.target.closest('#ic-hours button'); if(hb){ document.querySelectorAll('#ic-hours button').forEach(b=>b.setAttribute('aria-pressed', b===hb)); document.getElementById('ic-h').textContent = hb.dataset.h; return; }
  const wb = e.target.closest('[data-when]'); if(wb){ wb.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed', b===wb)); return; }
  const sec = e.target.closest('[data-sec]'); if(sec){ if(location.hash==='#admin'){ adminSec=sec.dataset.sec; } else { custSec=sec.dataset.sec; } view.innerHTML = location.hash==='#admin'?admin():customer(); return; }
  const row = e.target.closest('.row[data-b]'); if(row){ selBooking=+row.dataset.b; view.innerHTML = customer(); return; }
});
document.addEventListener('keydown', e=>{ const row=e.target.closest?.('.row[data-b]'); if(row && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); selBooking=+row.dataset.b; view.innerHTML=customer(); }});
document.addEventListener('change', e=>{ if(e.target.closest('#ic-tasks')) updateIC(); });
document.addEventListener('input', e=>{ if(e.target.id==='q'){ exState.q=e.target.value; renderResults(); }});
document.addEventListener('submit', e=>{
  e.preventDefault();
  if(e.target.id==='finder'){ exState.q=document.getElementById('q-home').value; location.hash='services'; return; }
  if(e.target.id==='interest'){
    const ok = document.getElementById('ic1').checked && /.+@.+\..+/.test(document.getElementById('ie').value);
    toast(ok ? 'Preview only: your interest is not saved.' : 'Enter an email and tick the first box to register interest.');
  }
});
route();
